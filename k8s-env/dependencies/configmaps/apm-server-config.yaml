apiVersion: v1
kind: ConfigMap
metadata:
  name: apm-server-config-e2e
  namespace: opencrvs-deps-e2e
data:
  apm-server.yml: |
    apm-server:
      host: '0.0.0.0:8200'
      rum:
        enabled: false
      kibana:
        enabled: false
        host: "${KIBANA_HOST}"
      ilm:
        enabled: 'auto'
        setup:
          enabled: true
          overwrite: true
          require_policy: true
          mapping:
            - event_type: 'error'
              policy_name: 'apm-rollover-e2e'
              index_suffix: ''
            - event_type: 'span'
              policy_name: 'apm-rollover-e2e'
              index_suffix: ''
            - event_type: 'transaction'
              policy_name: 'apm-rollover-e2e'
              index_suffix: ''
            - event_type: 'metric'
              policy_name: 'apm-rollover-e2e'
              index_suffix: ''
            - event_type: 'profile'
              policy_name: 'apm-rollover-e2e'
              index_suffix: ''
          policies:
            - name: 'apm-rollover-e2e'
              policy:
                phases:
                  hot:
                    actions:
                      rollover:
                        max_size: '50mb'
                        max_age: '6h'
                      set_priority:
                        priority: 100
                  delete:
                    min_age: '6h'
                    actions:
                      delete: {}
    queue:
      mem:
        events: 12096
    index:
      number_of_replicas: 0
    output.elasticsearch:
      hosts: ["${ELASTICSEARCH_HOST}"]
      username: "${ELASTICSEARCH_USERNAME}"
      password: "${ELASTICSEARCH_PASSWORD}"
      bulk_max_size: 12120
    logging.level: warning
