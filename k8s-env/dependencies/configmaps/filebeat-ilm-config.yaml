apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-ilm-config-e2e
  namespace: opencrvs-deps-e2e
data:
  filebeat-rollover-policy.json: |
    {
      "policy": {
        "phases": {
          "hot": {
            "min_age": "0ms",
            "actions": {
              "rollover": {
                "max_age": "6h",
                "max_size": "50mb"
              }
            }
          },
          "delete": {
            "min_age": "6h",
            "actions": {
              "delete": {
                "delete_searchable_snapshot": true
              }
            }
          }
        },
        "_meta": {
          "managed": true,
          "description": "Aggressive ILM policy for e2e environment with limited storage"
        }
      }
    }
