name: 13. Refresh e2e shard weights
run-name: "Refresh shard weights from recent ${{ inputs.core-branch || 'develop' }} runs"

on:
  schedule:
    # Roughly every two weeks — 1st and 15th of each month, 03:00 UTC.
    - cron: '0 3 1,15 * *'
  workflow_dispatch:
    inputs:
      core-branch:
        description: "Which opencrvs-core branch's latest successful e2e run to aggregate weights from"
        required: false
        default: 'develop'

jobs:
  refresh:
    runs-on: ubuntu-24.04
    env:
      # env: can't reference itself, so 'develop' is duplicated here and in run-name: (line 2).
      SOURCE_BRANCH: ${{ inputs.core-branch || 'develop' }}
      RUN_COUNT: '10'
    steps:
      - name: Find last ${{ env.RUN_COUNT }} successful e2e runs for ${{ env.SOURCE_BRANCH }}
        id: find-runs
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # .name is the dynamic run-name, not stable - match on head_branch instead.
          # status= as a query param silently drops real conclusion=="success" runs - filter via jq instead.
          # N runs, not 1 - a single run is noisy, and this only refreshes biweekly.
          run_ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-and-e2e.yml/runs?per_page=30" \
            --jq "[.workflow_runs[] | select(.head_branch == \"$SOURCE_BRANCH\") | select(.conclusion == \"success\")][:$RUN_COUNT] | map(.id)")

          if [ "$(echo "$run_ids" | jq 'length')" = "0" ]; then
            echo "No successful e2e run found for branch $SOURCE_BRANCH"
            exit 1
          fi

          echo "Using runs: $(echo "$run_ids" | jq -c --arg repo "$GITHUB_REPOSITORY" '. | map("https://github.com/" + $repo + "/actions/runs/" + (. | tostring))')"
          echo "run_ids=$(echo "$run_ids" | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "latest_run_id=$(echo "$run_ids" | jq -r '.[0]')" >> "$GITHUB_OUTPUT"

      - name: Resolve which core branch to pull the scripts from
        id: resolve-core-ref
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # Prefers a same-named core branch for the scripts, independent of which runs get aggregated.
          if gh api "repos/opencrvs/opencrvs-core/branches/${{ github.ref_name }}" > /dev/null 2>&1; then
            echo "ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$SOURCE_BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          repository: 'opencrvs/opencrvs-core'
          ref: ${{ steps.resolve-core-ref.outputs.ref }}
          sparse-checkout: |
            packages/testland

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Find ctrf artifacts from those runs
        id: find-artifacts
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # Expired (7-day retention) artifacts just contribute nothing here, not a failure.
          artifact_ids=$(for run_id in $(echo '${{ steps.find-runs.outputs.run_ids }}' | jq -r '.[]'); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" \
              --jq ".artifacts[] | select(.name | startswith(\"ctrf-report-shard-\")) | .id"
          done | paste -sd, -)

          echo "artifact_ids=$artifact_ids" >> "$GITHUB_OUTPUT"

      # download-artifact scopes artifact-ids to one run (this one has none) - fetch via GET /actions/artifacts/{id}/zip instead.
      - name: Download ctrf reports from those runs
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          mkdir -p ctrf-reports
          for artifact_id in $(echo "${{ steps.find-artifacts.outputs.artifact_ids }}" | tr ',' '\n'); do
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "ctrf-reports/$artifact_id.zip"
            unzip -q -o "ctrf-reports/$artifact_id.zip" -d "ctrf-reports/$artifact_id"
            rm "ctrf-reports/$artifact_id.zip"
          done

      - name: Aggregate into shard-weights.json
        working-directory: packages/testland
        run: |
          npx --yes tsx e2e/aggregate-shard-weights.ts ../../ctrf-reports > /tmp/new-weights.json
          node -e "
            const fs = require('fs');
            const path = 'e2e/shard-weights.json';
            const current = JSON.parse(fs.readFileSync(path, 'utf8'));
            const fresh = JSON.parse(fs.readFileSync('/tmp/new-weights.json', 'utf8'));
            const merged = { _comment: current._comment, ...fresh };
            fs.writeFileSync(path, JSON.stringify(merged, null, 2) + '\n');
          "
          npx prettier --write e2e/shard-weights.json

      - name: Open PR with the refreshed weights
        id: open-pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.CORE_ISSUES_PR_TOKEN }}
          path: .
          branch: chore/refresh-shard-weights-${{ steps.find-runs.outputs.latest_run_id }}
          base: ${{ env.SOURCE_BRANCH }}
          commit-message: 'chore(testland): refresh e2e shard weights'
          title: 'chore(testland): refresh e2e shard weights'
          body: |
            Regenerated `packages/testland/e2e/shard-weights.json`, averaged over the last ${{ env.RUN_COUNT }} successful e2e runs on `${{ env.SOURCE_BRANCH }}`. Most recent:
            https://github.com/${{ github.repository }}/actions/runs/${{ steps.find-runs.outputs.latest_run_id }}

            Data-only change — see `packages/testland/e2e/SHARDING.md` for how this fits into CI sharding.

      # Reuses the channel/token/action version already used for e2e notifications.
      - name: Notify Slack
        if: steps.open-pr.outputs.pull-request-url != ''
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: 'C08FCLKER8X'
          slack-message: 'Shard weights refreshed from the last ${{ env.RUN_COUNT }} ${{ env.SOURCE_BRANCH }} e2e runs — please review and merge: ${{ steps.open-pr.outputs.pull-request-url }}'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
