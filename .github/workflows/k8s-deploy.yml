name: 04. Deploy OpenCRVS
run-name: 'Deploy OpenCRVS (core: ${{ inputs.core-image-tag }}, country: ${{ inputs.countryconfig-image-tag }})'
on:
  workflow_call:
    inputs:
      core-image-tag:
        type: string
      countryconfig-image-tag:
        type: string
      environment:
        type: string
      keep-e2e:
        type: boolean
        default: false
      branch:
        type: string
        default: 'develop'
      core-branch:
        type: string
        default: 'develop'
  workflow_dispatch:
    inputs:
      core-image-tag:
        description: "Tag of the core image"
        required: true
        default: 'develop'
      countryconfig-image-tag:
        description: "Tag of the countryconfig image"
        required: true
        default: 'develop'
      environment:
        description: "Target environment"
        required: true
        default: 'demo'
        type: string
      keep-e2e:
        description: 'Add keep_namespace label'
        required: false
        type: boolean
        default: false
      branch:
        description: 'e2e branch'
        required: false
        default: 'develop'
      core-branch:
        description: 'Core branch'
        required: false
        default: 'develop'
jobs:
  deploy:
    env:
      ENV: ${{ inputs.environment }}
      CORE_IMAGE_TAG: ${{ inputs.core-image-tag }}
      COUNTRYCONFIG_IMAGE_TAG: ${{ inputs.countryconfig-image-tag }}
      # MOSIP integration's OpenCRVS system client. Both releases below need it:
      # countryconfig seeds the client, mosip-api authenticates as it.
      MOSIP_CLIENT_ID: ${{ secrets.OPENCRVS_MOSIP_CLIENT_ID }}
      MOSIP_CLIENT_SECRET: ${{ secrets.OPENCRVS_MOSIP_CLIENT_SECRET }}
    runs-on:
      - self-hosted
      - k8s
      - e2e
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}
      - name: Checkout OpenCRVS helm charts from core repository ${{ inputs.core-image-tag }}
        uses: actions/checkout@v6
        with:
          repository: opencrvs/opencrvs-core
          path: core
          ref: ${{ inputs.core-branch }}
      - name: Verify branch status ${{ inputs.core-branch }}
        working-directory: core
        run: git status
      - name: Generate summary
        run: |
          echo "Deploying environment to https://${{ inputs.environment }}.e2e-k8s.${{ vars.DOMAIN }}" >> $GITHUB_STEP_SUMMARY
          echo "Core image tag: ${{ inputs.core-image-tag }}" >> $GITHUB_STEP_SUMMARY
          echo "Country config image tag: ${{ inputs.countryconfig-image-tag }}" >> $GITHUB_STEP_SUMMARY

      - name: Print deployment parameters
        run: |
          echo "Environment: $ENV"
          echo "Core Image: $CORE_IMAGE_TAG"
          echo "Country Config Image: $COUNTRYCONFIG_IMAGE_TAG"
        # Create namespace separately from deployments. With two separate deployments (mosip & e2e), if other fails, we still want to be able to clean it based on updated_at.
      - name: Ensure namespace exists with updated_at label
        run: |
          if ! kubectl get namespace "opencrvs-${ENV}" >/dev/null 2>&1; then
            kubectl create namespace "opencrvs-${ENV}"
          fi
          kubectl label namespace --overwrite "opencrvs-${ENV}" updated_at=$(date +%s)
      - name: Deploy OpenCRVS MOSIP API
        run: |
          helm upgrade --install mosip-api core/charts/opencrvs-mosip \
          --namespace "opencrvs-${ENV}" \
          -f k8s-env/mosip-api/values.yaml \
          --set hostname=$ENV.e2e-k8s.opencrvs.dev \
          --set mosip_api.env.OPENCRVS_CLIENT_ID="$MOSIP_CLIENT_ID" \
          --set mosip_api.env.OPENCRVS_CLIENT_SECRET="$MOSIP_CLIENT_SECRET" \
          --atomic
      - name: Add updated_at timestamp label to namespace
        run: kubectl label namespace --overwrite opencrvs-${ENV} updated_at=$(date +%s)
      - name: Copy secrets from dependencies into application namespace
        run: |
          secrets=(
            "elasticsearch-admin-user"
            "redis-opencrvs-users"
            "minio-opencrvs-users"
            "mongodb-admin-user"
            "postgres-admin-user"
          )
          for secret in "${secrets[@]}"; do
            kubectl get secret $secret -n opencrvs-deps-e2e -o yaml \
            | sed "s#namespace: opencrvs-deps-e2e#namespace: opencrvs-${ENV}#" \
            | grep -vE 'resourceVersion|uid|creationTimestamp' \
            | kubectl apply -n opencrvs-${ENV} -f - \
            || echo "Secret $secret doesn't exist in opencrvs-deps-e2e namespace"
          done
      - name: Update k8s-env/opencrvs/values.yaml
        run: |
          sed -i -e "s#{{STACK_SANITIZED}}#${ENV//-/_}#g" \
                 -e "s#{{STACK}}#${ENV}#g" k8s-env/opencrvs/values.yaml
      - name: Deploy with Helm
        run: |
          stern -n "opencrvs-${ENV}" \
            --since 1s \
            --tail 0 \
            --exclude 'kube-probe' \
            --exclude '"level":(30|info)' \
            --template '{{.PodName}}/{{.ContainerName}} | {{.Message}}{{"\n"}}' \
            . &
          STERN_PID=$!
          helm upgrade --install opencrvs core/charts/opencrvs-services \
            --timeout 15m \
            --namespace "opencrvs-${ENV}" \
            -f k8s-env/opencrvs/values.yaml \
            --atomic \
            --set platform.tag="$CORE_IMAGE_TAG" \
            --set countryconfig.image.tag="$COUNTRYCONFIG_IMAGE_TAG" \
            --set hostname=$ENV.e2e-k8s.opencrvs.dev \
            --set data_seed.enabled=true \
            --set countryconfig.env.MOSIP_INTEGRATION_CLIENT_ID="$MOSIP_CLIENT_ID" \
            --set countryconfig.env.MOSIP_INTEGRATION_CLIENT_SECRET="$MOSIP_CLIENT_SECRET" \
            --set environment="$ENV" 2>&1 | sed '/USER-SUPPLIED VALUES:/,$d'; STATUS=${PIPESTATUS[0]};
            kill $STERN_PID 2>/dev/null || true
            exit $STATUS
      - name: Get notes from Helm release
        run: |
          helm get notes opencrvs -n "opencrvs-${ENV}" || echo "No notes found"
      - name: Add keep namespace label opencrvs-${ENV}
        if: inputs.keep-e2e
        run: kubectl label namespace opencrvs-${ENV} keep_namespace='true' --overwrite
      - name: Cleanup Helm Locks
        if: failure() || cancelled()
        run: |
          kubectl -n "opencrvs-${ENV}" get secrets -l owner=helm -o json | \
          jq -r '.items[] | select(.metadata.labels.status=="pending-install" or .metadata.labels.status=="pending-upgrade" or .metadata.labels.status=="pending-rollback") | .metadata.name' | \
          xargs -r kubectl -n "opencrvs-${ENV}" delete secret || \
          echo "No helm locks found, all is good"
