name: "15. Cleanup Namespace by Name"
run-name: "Cleanup namespace ${{ inputs.namespace }}"

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: "Full namespace name to clean up (e.g. opencrvs-my-branch)."
        required: true
        type: string

jobs:
  validate:
    name: Validate ${{ inputs.namespace }}
    runs-on: self-hosted
    outputs:
      namespace: ${{ steps.check.outputs.namespace }}
    steps:
      - name: Validate and guard namespace
        id: check
        env:
          namespace: ${{ inputs.namespace }}
        run: |
          if [ -z "$namespace" ]; then
            echo "❌ No namespace provided"
            exit 1
          fi
          # Only allow OpenCRVS e2e namespaces to be targeted
          case "$namespace" in
            opencrvs-*) ;;
            *)
              echo "❌ Refusing to clean up '$namespace': not an opencrvs-* namespace"
              exit 1
              ;;
          esac
          # Never remove protected namespaces
          case "$namespace" in
            opencrvs-e2e|opencrvs-deps-e2e)
              echo "❌ Refusing to clean up protected namespace '$namespace'"
              exit 1
              ;;
          esac
          if [ "$(kubectl get ns "$namespace" -o jsonpath='{.metadata.labels.keep_namespace}')" = "true" ]; then
            echo "❌ Refusing to clean up '$namespace': keep_namespace=true"
            exit 1
          fi
          if ! kubectl get ns "$namespace" > /dev/null 2>&1; then
            echo "❌ Namespace '$namespace' does not exist"
            exit 1
          fi
          echo "✅ '$namespace' is eligible for cleanup"
          echo "namespace=$namespace" >> $GITHUB_OUTPUT

  cleanup:
    needs: validate
    runs-on: self-hosted
    env:
      namespace: ${{ needs.validate.outputs.namespace }}
    name: Remove ${{ needs.validate.outputs.namespace }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Get helm release values and Quote specific fields that are commonly numeric
        id: get-values
        run: |
          helm get values opencrvs -n $namespace -ojson > /tmp/${namespace}.json || FAILED=true
          if [ "$FAILED" = true ]; then
            echo "⚠️ Warning: No OpenCRVS Helm release found in namespace ${namespace}"
            ENV=${namespace/opencrvs-/}
            TEMPLATE_VALUES_FILE=/tmp/${namespace}.yaml
            VALUES_FILE=/tmp/${namespace}.json
            sed -e "s#{{STACK_SANITIZED}}#${ENV//-/_}#g" \
               -e "s#{{STACK}}#${ENV}#g" k8s-env/opencrvs/values.yaml | yq -ojson > ${TEMPLATE_VALUES_FILE}
            if yq --version 2>&1 | grep -qi 'mikefarah'; then
              yq -o=json '.' "${TEMPLATE_VALUES_FILE}" > "${VALUES_FILE}"
            else
              yq '.' "${TEMPLATE_VALUES_FILE}" > "${VALUES_FILE}"
            fi
          fi
      # FIXME: utilities.image.tag remove after v2.1.0 release
      - name: Cleanup environment
        run: |
          kubectl delete job -n ${namespace} --ignore-not-found=true data-cleanup
          helm template -f /tmp/${namespace}.json \
              --set data_cleanup.enabled=true \
              --set data_cleanup.env.make_bucket=false \
              --set utilities.image.tag=35b1e0f \
              --namespace ${namespace} \
              -s templates/data-cleanup-job.yaml \
              oci://ghcr.io/opencrvs/opencrvs-services:v2.1.0 | kubectl apply -n ${namespace} --wait=true -f -
          sleep 30;
          kubectl logs job/data-cleanup -f --all-containers=true -n ${namespace} || true
          kubectl wait --for=condition=complete job/data-cleanup -n ${namespace} --timeout=600s;
      - name: Uninstall helm release
        run: helm uninstall opencrvs -n ${namespace} || echo "Helm release is not installed"
      - name: Delete namespace ${namespace}
        if: always()
        run: kubectl delete ns ${namespace}
