name: 01. Deploy & run E2E
run-name: 'E2E by ${{ github.event.client_payload.actor || github.actor }} to ${{ github.event.client_payload.stack || github.event.inputs.stack }} (core: ${{ github.event.client_payload.core-image-tag || inputs.core-image-tag }})'
on:
  repository_dispatch:
    types: [run_e2e]
  workflow_dispatch:
    inputs:
      core-image-tag:
        description: Core image tag (also tags the testland image — testland ships in core)
        required: true
        default: 'v2.0.0'
      stack:
        type: string
        description: Stack name
        required: true
      keep-e2e:
        description: Keep environment after run
        required: false
        default: false
        type: boolean
      core-branch:
        description: core branch
        required: false
        default: 'develop'
      branch:
        description: e2e branch
        required: false
        default: 'develop'
      reset:
        description: reset e2e
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.event.client_payload.stack || inputs.stack }}
  cancel-in-progress: true

env:
  OPENCRVS_CHART_VERSION: 'v2.0.0'

jobs:
  debug:
    name: Debug output
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Print Entire Event Payload
        run: |
          echo "${{ toJson(github.event) }}"
  check-env-existance:
    name: Check if environment exists
    runs-on: [self-hosted, k8s, e2e]
    outputs:
      exists: ${{ steps.check.outputs.status }}
    steps:
      - name: check namespace
        id: check
        env:
          ENV: ${{ github.event.client_payload.stack || inputs.stack }}
        run: |
          helm get values opencrvs -n opencrvs-${ENV} && status=true || status=false
          echo "status=$status"  >> $GITHUB_OUTPUT
  reset-data:
    needs: [check-env-existance]
    if: needs.check-env-existance.outputs.exists == 'true' && (github.event.client_payload.reset || inputs.reset || true)
    uses: ./.github/workflows/k8s-reset-data.yml
    with:
      environment: ${{ github.event.client_payload.stack || inputs.stack }}
      core-branch: ${{ inputs.core-branch }}
    secrets: inherit

  cache-node-js:
    name: Cache Node.js dependencies
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      # testland resolves @opencrvs/toolkit as a yarn workspace, so toolkit and
      # its build inputs (commons, events) must be checked out and built from
      # the same core ref — otherwise yarn would fall back to the npm-published
      # toolkit and tests would not see the PR's toolkit changes.
      - uses: actions/checkout@v6
        with:
          repository: 'opencrvs/opencrvs-core'
          ref: ${{ github.event.client_payload.core-branch || inputs.core-branch }}
          sparse-checkout: |
            development-environment
            packages/testland
            packages/toolkit
            packages/commons
            packages/events

      # Cone-mode sparse checkout always includes root files, so the monorepo
      # root .nvmrc is available even though packages/testland has none.
      - name: Set up Node.js from core .nvmrc
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      # Root yarn workspace install hoists dependencies to the repo-root
      # node_modules, so that (plus each package's local node_modules) is what
      # has to be cached — not just packages/testland. Build outputs are not
      # cached; the toolkit chain rebuilds in every job (fast).
      - name: Cache Node.js dependencies
        uses: actions/cache@v6
        id: cache
        with:
          path: |
            node_modules
            packages/testland/node_modules
            packages/toolkit/node_modules
            packages/commons/node_modules
            packages/events/node_modules
            ~/.cache/yarn/v6
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-node-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        uses: nick-fields/retry@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: yarn

      - uses: nick-fields/retry@v4
        name: Install Playwright Browsers
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: cd packages/testland && npx playwright install --with-deps

  deploy:
    uses: ./.github/workflows/k8s-deploy.yml
    if: '!cancelled()'
    needs: reset-data
    with:
      core-image-tag: ${{ github.event.client_payload.core-image-tag || inputs.core-image-tag }}
      core-branch: ${{ github.event.client_payload.core-branch || inputs.core-branch }}
      branch: ${{ github.event.client_payload.branch || inputs.branch }}
      environment: ${{ github.event.client_payload.stack || inputs.stack }}
      keep-e2e: ${{ github.event.client_payload.keep-e2e == 'true' || github.event.client_payload.keep-e2e == true || inputs.keep-e2e || false }}
    secrets: inherit

  test:
    needs: [debug, deploy, cache-node-js]
    if: "!cancelled() && needs.deploy.result == 'success'"
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      max-parallel: 15
      fail-fast: false
      matrix:
        # Since we are not yet in a place where we can reliably run all tests in parallel, we will run the slowest ones first
        shard:
          [
            20,
            3,
            2,
            1,
            15,
            5,
            4,
            16,
            19,
            7,
            17,
            8,
            9,
            12,
            14,
            18,
            6,
            10,
            11,
            13
          ]
    name: shard-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: 'opencrvs/opencrvs-core'
          ref: ${{ github.event.client_payload.core-branch || inputs.core-branch }}
          sparse-checkout: |
            development-environment
            packages/testland
            packages/toolkit
            packages/commons
            packages/events

      - name: Set up Node.js from core .nvmrc
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Cache Node.js dependencies
        uses: actions/cache@v6
        id: cache
        with:
          path: |
            node_modules
            packages/testland/node_modules
            packages/toolkit/node_modules
            packages/commons/node_modules
            packages/events/node_modules
            ~/.cache/yarn/v6
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-node-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: yarn
      - name: Build toolkit (with commons and events)
        run: yarn --cwd packages/toolkit build:all
      - uses: nick-fields/retry@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: cd packages/testland && npx playwright install --with-deps
      - name: Run Playwright Tests
        working-directory: packages/testland
        run: |
          export NODE_EXTRA_CA_CERTS=/tmp/letsencrypt-stg-root-x1.pem
          curl -s -o $NODE_EXTRA_CA_CERTS https://letsencrypt.org/certs/staging/letsencrypt-stg-root-x1.pem
          npx playwright test --shard=${{ matrix.shard }}/20
        env:
          DOMAIN: '${{ github.event.client_payload.stack || inputs.stack }}.e2e-k8s.${{ vars.DOMAIN }}'
      - id: ctrf_check
        if: '!cancelled()'
        working-directory: packages/testland
        run: |
          [ -d ctrf ] && \
           echo "ctrf=true" >> $GITHUB_OUTPUT || \
           echo "ctrf=false" >> $GITHUB_OUTPUT
      - name: Publish Test Report
        uses: ctrf-io/github-test-reporter@v1
        with:
          report-path: './packages/testland/ctrf/*.json'
          github-report: true
          summary-report: true
          test-report: true
        if: "!cancelled() && steps.ctrf_check.outputs.ctrf == 'true'"
      - name: Upload report artifact
        uses: actions/upload-artifact@v7
        if: '!cancelled()'
        with:
          name: playwright-report-${{ github.event.client_payload.stack || inputs.stack }}-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: packages/testland/playwright-report/
          retention-days: 30

  get-previous-run:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      previous_run_result: ${{ steps.set-output.outputs.result }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get Previous Run Conclusion
        id: get-previous-conclusion
        run: |
          previous_conclusion=$(gh run list --limit 1 --status=completed --workflow="01. Deploy & run E2E" --json conclusion -q '.[0].conclusion')
          echo "PREVIOUS_CONCLUSION=$previous_conclusion" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Set Output Based on Conclusion
        id: set-output
        run: |
          echo "result=$PREVIOUS_CONCLUSION" >> $GITHUB_OUTPUT

  cleanup-stack-k8s:
    needs: [test, debug]
    runs-on: [self-hosted]
    env:
      ENV: ${{ github.event.client_payload.stack || inputs.stack }}
    if: "!cancelled() && needs.test.result == 'success' && inputs.keep-e2e != 'true' && inputs.keep-e2e != true && github.event.client_payload.keep-e2e != 'true' && github.event.client_payload.keep-e2e != true"
    steps:
      - name: Checkout OpenCRVS helm charts from core repository ${{ inputs.core-image-tag }}
        uses: actions/checkout@v6
        with:
          repository: opencrvs/opencrvs-core
          path: core
          ref: ${{ inputs.core-branch }}
      - name: Verify branch status ${{ inputs.core-branch }}
        working-directory: core
        run: git status
      - name: Get helm release values and Quote specific fields that are commonly numeric
        id: get-values
        run: |
          helm get values opencrvs -n opencrvs-${ENV} -ojson > /tmp/opencrvs-${ENV}.json
      - name: Cleanup environment
        run: |
          kubectl delete job -n opencrvs-${ENV} --ignore-not-found=true data-cleanup
          helm template -f /tmp/opencrvs-${ENV}.json \
              --set data_cleanup.enabled=true \
              --set image.tag="${{ inputs.core-image-tag }}" \
              --namespace opencrvs-${ENV} \
              -s templates/data-cleanup-job.yaml \
              core/charts/opencrvs-services/ | kubectl apply -n opencrvs-${ENV} --wait=true -f -
          sleep 30;
          kubectl logs job/data-cleanup -f --all-containers=true -n opencrvs-${ENV} || true
          kubectl wait --for=condition=complete job/data-cleanup -n opencrvs-${ENV} --timeout=600s;
      - name: Delete helm release and namespace
        run: |
          kubectl delete namespace opencrvs-${ENV}
